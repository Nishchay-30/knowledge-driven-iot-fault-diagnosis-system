[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-diagnosis-system"
version = "1.0.0"
description = "Knowledge-Driven IoT-Based Fault Diagnosis System for Industrial 12V DC Motors"
authors = [{ name = "IoT & AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "plotly>=6.0.0",
    "joblib>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

